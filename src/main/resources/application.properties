spring.application.name=waper-api
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/waperdb}
spring.data.mongodb.database=${MONGODB_DATABASE:waperdb}

app.security.api-user=${API_USER:admin}
app.security.api-password=${API_PASSWORD:1234}

jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
